{% load tailwind_tags %}
{% tailwind_css %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FootHold{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.02em; }
        .rack-shadow { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.05); }
        .status-blink { animation: blink 1.5s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-[#050505] text-zinc-400 min-h-screen flex flex-col selection:bg-lime-500 selection:text-black">

    <header class="sticky top-0 z-50 bg-[#0a0a0a] border-b border-zinc-800 rack-shadow">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">

                <div class="flex items-center gap-6">
                    <a href="/" class="flex items-center gap-2 group">
                        <span class="text-white font-black text-lg tracking-tighter group-hover:text-lime-500 transition-colors">FOOTHOLD</span>
                        <span class="text-zinc-700 font-bold text-xs">v2.6</span>
                    </a>

                    <div class="hidden md:flex items-center gap-4 px-4 border-l border-zinc-800 text-[10px] font-bold uppercase tracking-widest text-zinc-500">
                        <span class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-lime-500 status-blink"></span> LIVE</span>
                        <span class="text-zinc-800">|</span>
                        <span>DB_CONN: OK</span>
                        <span class="text-zinc-800">|</span>
                        <span class="text-yellow-600/80">Uptime: 99.9%</span>
                    </div>
                </div>

                <nav class="flex items-center gap-1">
                    <a href="{% url 'index' %}" class="px-3 py-1.5 text-[10px] font-bold hover:bg-zinc-900 hover:text-lime-400 border border-transparent hover:border-zinc-700 transition-all uppercase">Writeups</a>
                    <a href="{% url 'LBoard' %}" class="px-3 py-1.5 text-[10px] font-bold hover:bg-zinc-900 hover:text-lime-400 border border-transparent hover:border-zinc-700 transition-all uppercase">L-Board</a>
                    <a href="{% url 'id' %}" class="px-3 py-1.5 text-[10px] font-bold hover:bg-zinc-900 hover:text-lime-400 border border-transparent hover:border-zinc-700 transition-all uppercase">Identity</a>
                    <div class="w-px h-4 bg-zinc-800 mx-2"></div>
                    <a href="#" class="bg-lime-600/10 text-lime-500 border border-lime-500/20 px-3 py-1.5 text-[10px] font-black hover:bg-lime-500 hover:text-black transition-all">RESUME.BIN</a>
                </nav>
            </div>
        </div>
    </header>
: <main class="grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        {% block content %}

        {% endblock %}

    </main>

    <footer class="bg-[#080808] border-t border-zinc-900 py-8">
        <div class="max-w-4xl mx-auto px-6 flex justify-between items-center text-[9px] text-zinc-700 font-black uppercase tracking-widest">
            <div class="flex gap-4">
                <span>FM6</span>
                <span>//</span>

            </div>
            <p>&copy; 2026 FOOTHOLD</p>
        </div>
    </footer>

</body>
</html>
